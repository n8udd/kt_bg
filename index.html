<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kill Team — Build Guides</title>
<script>
  // Apply the saved theme before first paint (the toggle lives in script.js: setTheme).
  (function () {
    var t = 'system';
    try { t = localStorage.getItem('kt-theme') || 'system'; } catch (e) {}
    var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          // Theme tokens: values are RGB channels set per theme in the <style> block below.
          bg:           'rgb(var(--c-bg) / <alpha-value>)',
          panel:        'rgb(var(--c-panel) / <alpha-value>)',
          'panel-alt':  'rgb(var(--c-panel-alt) / <alpha-value>)',
          head:         'rgb(var(--c-head) / <alpha-value>)',
          ink:          'rgb(var(--c-ink) / <alpha-value>)',
          'ink-dim':    'rgb(var(--c-ink-dim) / <alpha-value>)',
          'ink-empty':  'rgb(var(--c-ink-empty) / <alpha-value>)',
          rule:         'rgb(var(--c-rule) / <alpha-value>)',
          'rule-strong':'rgb(var(--c-rule-strong) / <alpha-value>)',
          accent:       'rgb(var(--c-accent) / <alpha-value>)',
          'accent-dim': 'rgb(var(--c-accent-dim) / <alpha-value>)',
          'on-accent':  'rgb(var(--c-on-accent) / <alpha-value>)',
          melee:        'rgb(var(--c-melee) / <alpha-value>)',
          danger:       'rgb(var(--c-danger) / <alpha-value>)',
        },
        fontFamily: {
          display: ['Anton', 'sans-serif'],
          sans:    ['IBM Plex Sans', 'system-ui', 'sans-serif'],
          mono:    ['IBM Plex Mono', 'monospace'],
        },
      }
    }
  }
</script>

<style type="text/tailwindcss">
  @layer base {
    :root {
      color-scheme: light;
      --c-bg: 244 242 238;
      --c-bg-glow: 255 255 255;
      --c-panel: 255 255 255;
      --c-panel-alt: 240 238 233;
      --c-head: 233 230 223;
      --c-ink: 27 27 31;
      --c-ink-dim: 92 90 85;
      --c-ink-empty: 185 183 176;
      --c-rule: 226 223 216;
      --c-rule-strong: 201 197 188;
      --c-accent: 194 65 12;
      --c-accent-dim: 240 184 154;
      --c-on-accent: 255 255 255;
      --c-melee: 107 100 86;
      --c-danger: 179 38 30;
    }
    .dark {
      color-scheme: dark;
      --c-bg: 12 12 14;
      --c-bg-glow: 26 26 32;
      --c-panel: 22 22 26;
      --c-panel-alt: 28 28 34;
      --c-head: 0 0 0;
      --c-ink: 233 231 226;
      --c-ink-dim: 138 135 128;
      --c-ink-empty: 58 58 66;
      --c-rule: 37 37 44;
      --c-rule-strong: 61 61 72;
      --c-accent: 232 90 28;
      --c-accent-dim: 107 42 18;
      --c-on-accent: 0 0 0;
      --c-melee: 184 176 160;
      --c-danger: 217 122 106;
    }
    [x-cloak] { display: none !important; }
    body {
      background: radial-gradient(ellipse at top, rgb(var(--c-bg-glow)) 0%, rgb(var(--c-bg)) 60%) no-repeat, rgb(var(--c-bg));
      font-size: 13.5px;
      line-height: 1.45;
    }
    tbody td { @apply py-2 px-3 border-b border-rule align-middle; }
    tr.new-op > td { border-top: 2px solid rgb(var(--c-rule-strong)); }
  }
  @layer components {
    thead th { @apply bg-head text-accent font-display font-normal tracking-[0.1em] uppercase text-[11.5px] py-[11px] px-3 text-left border-b-2 border-b-accent whitespace-nowrap; }
    .team-selector {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%23c2410c' stroke-width='2'><path d='M1 1l5 5 5-5'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 12px 8px;
    }
    .dark .team-selector {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none' stroke='%23e85a1c' stroke-width='2'><path d='M1 1l5 5 5-5'/></svg>");
    }
    .team-selector:hover, .team-selector:focus { @apply border-accent outline-none; }
    .team-selector option { background-color: rgb(var(--c-head)); color: rgb(var(--c-ink)); }
    /* Table lives in its own scroll pane so the horizontal scrollbar stays on
       screen, with a sticky header row and sticky Operative column. Collapsed
       borders don't travel with sticky cells, so their edges are inset shadows. */
    .table-pane { max-height: calc(100vh - 2rem); }
    .table-pane thead th {
      position: sticky; top: 0; z-index: 20;
      box-shadow: inset 0 -2px 0 rgb(var(--c-accent));
    }
    .table-pane td.op-cell, .table-pane th.op-cell {
      position: sticky; left: 0;
      box-shadow: inset -2px 0 0 rgb(var(--c-accent));
    }
    .table-pane td.op-cell { z-index: 10; }
    .table-pane th.op-cell {
      z-index: 30;
      box-shadow: inset -2px 0 0 rgb(var(--c-accent)), inset 0 -2px 0 rgb(var(--c-accent));
    }
    .intro strong { @apply text-ink; }
    .intro code { @apply font-mono text-ink text-xs bg-ink/[0.06] px-1 rounded-sm; }
    .op-modal { border: 1px solid rgb(var(--c-rule-strong)); border-top: 3px solid rgb(var(--c-accent)); }
    .footnotes strong { @apply text-ink; }
    .footnotes .marker { @apply text-accent font-semibold; }
    .error-banner strong { @apply text-danger; }
    .ability-text ul { @apply mt-1.5 pl-[18px] list-disc; }
    .ability-text li { @apply mb-1; }
    .op-label, .weapon-label {
      @apply inline-flex items-center gap-2 cursor-pointer;
    }
    .op-info, .weapon-info {
      @apply inline-flex items-center justify-center w-4 h-4 text-ink-dim transition-colors duration-150 shrink-0;
    }
    .op-label:hover .op-info, .weapon-label:hover .weapon-info {
      @apply text-accent;
    }
  }
  @media print {
    body { background: white !important; color: black !important; padding: 8px !important; font-size: 8.5pt !important; }
    .selector-row, .theme-toggle, .roster-bar, .roster-col { display: none !important; }
    .team-section { display: block !important; page-break-before: always; }
    .team-section:first-of-type { page-break-before: auto; }
    tbody td, thead th { border-color: #ccc !important; color: black !important; }
    thead th { background: #eee !important; }
    table { min-width: 0 !important; }
    .table-pane { max-height: none !important; overflow: visible !important; }
    .table-pane thead th, .table-pane td.op-cell, .table-pane th.op-cell {
      position: static !important; box-shadow: none !important;
    }
  }
</style>
<script src="script.js" defer></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
</head>
<body x-data="kt" x-cloak class="m-0 px-6 pt-10 pb-20 text-ink font-sans">

<div class="mx-auto">

<header class="border-b-2 border-accent pb-4 mb-6 flex flex-wrap items-end justify-between gap-4">
  <h1 class="font-display text-[56px] font-normal tracking-[0.04em] m-0 uppercase leading-none">Kill Team <span class="text-accent">— Build Guides</span></h1>
  <div class="theme-toggle flex border border-rule-strong font-display uppercase text-[11px] tracking-[0.1em]" role="group" aria-label="Colour theme">
    <template x-for="opt in ['light', 'dark', 'system']" :key="opt">
      <button type="button" class="px-3 py-1.5 cursor-pointer transition-colors duration-150"
              :class="theme === opt ? 'bg-accent text-on-accent' : 'bg-panel text-ink-dim hover:text-accent'"
              :aria-pressed="theme === opt" @click="setTheme(opt)" x-text="opt"></button>
    </template>
  </div>
</header>

<div class="py-[60px] px-5 text-center text-ink-dim text-[13px] tracking-[0.06em]" x-show="loading">Loading team data…</div>

<div class="error-banner bg-panel border-l-[3px] border-danger text-ink py-[14px] px-5 mb-6 font-mono text-xs" x-show="error" x-cloak>
  <strong>Couldn't load team data.</strong>
  <span x-text="error"></span>
</div>

<template x-if="!loading && !error && data.teams.length">
  <div class="selector-row flex items-center gap-4 mb-8 py-[14px] px-[18px] bg-panel border-l-[3px] border-accent">
    <label class="font-display uppercase text-accent text-[14px] tracking-[0.12em]" for="team-select">Kill Team</label>
    <select id="team-select" class="team-selector bg-head text-ink border border-accent-dim py-[9px] pr-10 pl-[14px] font-display uppercase text-base tracking-[0.06em] cursor-pointer transition-colors duration-150" x-model="selectedKey">
      <template x-for="team in data.teams" :key="team.key">
        <option :value="team.key" x-text="team.name"></option>
      </template>
    </select>
  </div>
</template>

<template x-for="team in data.teams" :key="team.key">
  <section class="team-section" x-show="team.key === selectedKey" @click="handleOpClick($event)">
    <div class="text-ink-dim mb-4 text-xs tracking-[0.08em] uppercase" x-text="team.subtitle"></div>
    <div class="intro bg-panel border-l-[3px] border-accent py-[14px] px-5 mb-7 text-[13px] text-ink-dim" x-show="team.intro" x-text="team.intro"></div>

    <div class="roster-bar flex flex-wrap items-center gap-3 mb-4">
      <div class="flex border border-rule-strong font-display uppercase text-[11px] tracking-[0.1em]" role="group" aria-label="Table view">
        <button type="button" class="px-3 py-1.5 cursor-pointer transition-colors duration-150"
                :class="view === 'all' ? 'bg-accent text-on-accent' : 'bg-panel text-ink-dim hover:text-accent'"
                :aria-pressed="view === 'all'" @click="setView('all')">All loadouts</button>
        <button type="button" class="px-3 py-1.5 cursor-pointer transition-colors duration-150"
                :class="view === 'roster' ? 'bg-accent text-on-accent' : 'bg-panel text-ink-dim hover:text-accent'"
                :aria-pressed="view === 'roster'" @click="setView('roster')"
                x-text="'My roster (' + rosterFor(team).length + ')'"></button>
      </div>
      <button type="button" class="font-display uppercase text-[11px] tracking-[0.1em] px-3 py-1.5 border border-rule-strong text-ink-dim hover:text-danger hover:border-danger cursor-pointer transition-colors duration-150"
              x-show="rosterFor(team).length" @click="clearRoster(team.key)">Clear roster</button>
    </div>

    <div class="bg-panel border-l-[3px] border-rule-strong py-[14px] px-5 mb-7 text-[13px] text-ink-dim"
         x-show="view === 'roster' && !viewTeam(team).loadouts.length">
      Your roster is empty. Switch to <strong class="text-ink">All loadouts</strong> and use <strong class="text-ink">+ Add</strong> on the builds you're fielding.
    </div>

    <div class="table-pane overflow-auto border border-rule-strong" x-show="viewTeam(team).loadouts.length">
      <table :style="tableStyle(viewTeam(team))" class="w-full border-collapse bg-panel text-[12.5px]">
        <thead>
          <tr>
            <template x-for="(h, hi) in headerCells(viewTeam(team))" :key="hi">
              <th :class="h.cls" x-text="h.text"></th>
            </template>
          </tr>
        </thead>
        <tbody>
          <template x-for="(row, rIdx) in allSubRows(viewTeam(team))" :key="rIdx">
            <tr :class="row.cls">
              <template x-for="(cell, ci) in row.cells" :key="ci">
                <td :class="cell.cls" :rowspan="cell.rowspan" x-html="cell.html"></td>
              </template>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <template x-if="team.faction_rules && team.faction_rules.length">
      <div class="mt-5 py-3 px-[18px] bg-panel border-l-[3px] border-rule-strong text-xs leading-[1.65]">
        <div class="font-display uppercase text-[10.5px] tracking-[0.12em] text-ink-dim mb-2">Faction Rules</div>
        <template x-for="(item, i) in team.faction_rules" :key="i">
          <div class="mb-1 last:mb-0">
            <span class="font-semibold text-ink" x-text="item.name"></span>
            <template x-if="item.text"><span class="text-ink-dim"> — </span></template>
            <template x-if="item.text"><span class="text-ink-dim" x-text="item.text"></span></template>
          </div>
        </template>
      </div>
    </template>

    <template x-if="team.strategy_ploys && team.strategy_ploys.length">
      <div class="mt-5 py-3 px-[18px] bg-panel border-l-[3px] border-rule-strong text-xs leading-[1.65]">
        <div class="font-display uppercase text-[10.5px] tracking-[0.12em] text-ink-dim mb-2">Strategy Ploys</div>
        <template x-for="(item, i) in team.strategy_ploys" :key="i">
          <div class="mb-1 last:mb-0">
            <span class="font-semibold text-ink" x-text="item.name"></span>
            <template x-if="item.text"><span class="text-ink-dim"> — </span></template>
            <template x-if="item.text"><span class="text-ink-dim" x-text="item.text"></span></template>
          </div>
        </template>
      </div>
    </template>

    <template x-if="team.firefight_ploys && team.firefight_ploys.length">
      <div class="mt-5 py-3 px-[18px] bg-panel border-l-[3px] border-rule-strong text-xs leading-[1.65]">
        <div class="font-display uppercase text-[10.5px] tracking-[0.12em] text-ink-dim mb-2">Firefight Ploys</div>
        <template x-for="(item, i) in team.firefight_ploys" :key="i">
          <div class="mb-1 last:mb-0">
            <span class="font-semibold text-ink" x-text="item.name"></span>
            <template x-if="item.text"><span class="text-ink-dim"> — </span></template>
            <template x-if="item.text"><span class="text-ink-dim" x-text="item.text"></span></template>
          </div>
        </template>
      </div>
    </template>

    <template x-if="team.equipment && team.equipment.length">
      <div class="mt-5 py-3 px-[18px] bg-panel border-l-[3px] border-rule-strong text-xs leading-[1.65]">
        <div class="font-display uppercase text-[10.5px] tracking-[0.12em] text-ink-dim mb-2">Equipment</div>
        <template x-for="(item, i) in team.equipment" :key="i">
          <div class="mb-1 last:mb-0">
            <span class="font-semibold text-ink" x-text="item.name"></span>
            <template x-if="item.text"><span class="text-ink-dim"> — </span></template>
            <template x-if="item.text"><span class="text-ink-dim" x-text="item.text"></span></template>
          </div>
        </template>
      </div>
    </template>

    <div class="footnotes mt-6 py-3 px-[18px] bg-panel border-l-[3px] border-accent-dim text-ink-dim text-[11.5px] leading-[1.7]" x-show="team.footnotes_html" x-html="team.footnotes_html"></div>
  </section>
</template>

<!-- Operative modal -->
<div class="fixed inset-0 bg-black/[0.78] flex items-center justify-center z-[1000] p-5" x-show="openOperative" x-cloak @click="closeOperative()">
  <div class="op-modal bg-panel w-full max-w-[640px] max-h-[88vh] overflow-y-auto py-7 px-8 relative" @click.stop x-show="openOperative">
    <button class="absolute top-[10px] right-[14px] bg-transparent border-none text-ink-dim text-[30px] leading-none px-2 py-1 cursor-pointer hover:text-accent" @click="closeOperative()" aria-label="Close">×</button>
    <h2 class="font-display text-[26px] font-normal m-0 mb-[18px] text-ink uppercase tracking-[0.04em]" x-text="openOperative && openOperative.name"></h2>
    <div>
      <template x-for="(ability, ai) in (openOperative && openOperative.abilities) || []" :key="ai">
        <div class="mb-[18px] pb-[18px] border-b border-rule last:border-b-0 last:mb-0 last:pb-0">
          <div class="flex items-center flex-wrap gap-[10px] mb-1.5">
            <span class="font-display text-[15px] text-ink uppercase tracking-[0.04em]" x-text="ability.name"></span>
            <template x-if="ability.tag">
              <span class="font-display text-[10px] bg-accent text-on-accent px-1.5 py-0.5 tracking-[0.08em] uppercase" x-text="ability.tag"></span>
            </template>
          </div>
          <div class="ability-text text-[12.5px] text-ink-dim leading-[1.55]" x-html="ability.text"></div>
        </div>
      </template>
    </div>
  </div>
</div>

<!-- Weapon modal -->
<div class="fixed inset-0 bg-black/[0.78] flex items-center justify-center z-[1000] p-5" x-show="openWeapon" x-cloak @click="closeWeapon()">
  <div class="op-modal bg-panel w-full max-w-[640px] max-h-[88vh] overflow-y-auto py-7 px-8 relative" @click.stop x-show="openWeapon">
    <button class="absolute top-[10px] right-[14px] bg-transparent border-none text-ink-dim text-[30px] leading-none px-2 py-1 cursor-pointer hover:text-accent" @click="closeWeapon()" aria-label="Close">×</button>
    <h2 class="font-display text-[26px] font-normal m-0 mb-[18px] text-ink uppercase tracking-[0.04em]" x-text="openWeapon && openWeapon.name"></h2>
    <div>
      <template x-for="(ability, ai) in (openWeapon && openWeapon.abilities) || []" :key="ai">
        <div class="mb-[18px] pb-[18px] border-b border-rule last:border-b-0 last:mb-0 last:pb-0">
          <div class="flex items-center flex-wrap gap-[10px] mb-1.5">
            <span class="font-display text-[15px] text-ink uppercase tracking-[0.04em]" x-text="ability.name"></span>
            <template x-if="ability.tag">
              <span class="font-display text-[10px] bg-accent text-on-accent px-1.5 py-0.5 tracking-[0.08em] uppercase" x-text="ability.tag"></span>
            </template>
          </div>
          <div class="ability-text text-[12.5px] text-ink-dim leading-[1.55]" x-html="ability.text"></div>
        </div>
      </template>
    </div>
  </div>
</div>

</div>

</body>
</html>
